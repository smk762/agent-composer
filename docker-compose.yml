services:
  # ── Stateful services live on the dedicated stateful node (<STATEFUL_HOST>) ──
  # PostgreSQL (chat history), Qdrant (vector store), and MinIO (object store)
  # are NOT run in this compose stack any more. They are provided by the remote
  # stateful node and reached over the LAN via:
  #   DATABASE_URL  -> postgresql://...@<STATEFUL_HOST>:5432/ragchat
  #   QDRANT_URL    -> http://<STATEFUL_HOST>:6333
  #   S3_ENDPOINT_URL / MEDIA_S3_ENDPOINT_URL -> http://<STATEFUL_HOST>:9000
  # Bucket provisioning is handled at launch by the `minio-setup` one-shot
  # below; PostgreSQL schema by rag-chat's init (bootstrap_db + alembic); Qdrant
  # collections by rag-ingest on startup. Credentials live in .env.

  # One-shot MinIO provisioner (stateful node). Idempotently creates rag-chat's
  # voice bucket (re-hosted and stitched audio) and the media bucket if missing,
  # and grants anonymous read on the generated-audio prefix so browsers can play
  # it. argus-echo provisions its engines' own buckets. Safe to re-run on every `up`.
  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-setup
    restart: "no"
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL in .env (see .env.example)}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - TTS_BUCKET=${S3_BUCKET_NAME:-voice}
      - MEDIA_BUCKET=${MEDIA_S3_BUCKET:-uploads}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set stateful "$$S3_ENDPOINT_URL" "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "stateful/$$TTS_BUCKET"
        mc anonymous set download "stateful/$$TTS_BUCKET/generated"
        mc mb --ignore-existing "stateful/$$MEDIA_BUCKET"
        echo "minio ready @ $$S3_ENDPOINT_URL: $$TTS_BUCKET (public: generated/), $$MEDIA_BUCKET (private)"
    networks: [internal]

  # Local LLM runtime (kept internal; accessed by rag-ingest and rag-chat only)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # GPU: requires NVIDIA Container Toolkit on the host
    # (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html).
    # Remove `gpus` and NVIDIA_* env vars to run CPU-only.
    gpus: all
    ports:
      - "${OLLAMA_BIND_IP:-${BIND_ADDR:-127.0.0.1}}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-15m}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://127.0.0.1:11434/api/tags >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Code-audit embedder (sentence-transformers via Infinity): OpenAI-compatible
  # /embeddings (and /rerank when a reranker is listed). Used by rag-ingest in code
  # mode and by rag-chat's repair code search.
  # VRAM, measured on dragon (fp16, 4000-char chunks = rag-ingest's cap):
  #   CodeRankEmbed, batch 8: 0.8 GB loaded, 1.3 GB peak  <- default
  #   CodeRankEmbed, batch 32: 1.5 GB loaded, 3.5 GB peak
  #   + bge-reranker-v2-m3: +1.26 GB (4.7 GB peak at batch 32); nothing calls /rerank today
  # Peak memory stays reserved until the manager stops the child (INFINITY_IDLE_TIMEOUT).
  infinity:
    build:
      context: ./infinity-manager
    container_name: infinity
    restart: unless-stopped
    gpus: all
    environment:
      # argus-iris resident contract: Bearer token for /admin/* (open when empty).
      - ARGUS_ADMIN_TOKEN=${ARGUS_ADMIN_TOKEN:-}
      - HF_HOME=/data/hf
      # Comma-separated. To serve the reranker too: ${EMBED_MODEL_CODE},BAAI/bge-reranker-v2-m3
      - INFINITY_MODEL_IDS=${INFINITY_MODEL_IDS:-${EMBED_MODEL_CODE:-nomic-ai/CodeRankEmbed}}
      # Max batch per forward pass; the main driver of peak VRAM (see above).
      - INFINITY_EXTRA_ARGS=${INFINITY_EXTRA_ARGS:---batch-size 8}
      - INFINITY_QUEUE_SIZE=${INFINITY_QUEUE_SIZE:-512}
      - INFINITY_IDLE_TIMEOUT=${INFINITY_IDLE_TIMEOUT:-300}
      - INFINITY_PRELOAD=${INFINITY_PRELOAD:-0}
      - INFINITY_STARTUP_TIMEOUT=${INFINITY_STARTUP_TIMEOUT:-180}
      - INFINITY_REQUEST_TIMEOUT=${INFINITY_REQUEST_TIMEOUT:-300}
      - INFINITY_ENGINE=torch
      - INFINITY_DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - infinity_hf_cache:/data/hf
    # Loopback only: consumed internally via http://infinity:7997, plus the
    # same-host ai-code-auditor which reaches it on 127.0.0.1:7997. No LAN need.
    ports:
      - "127.0.0.1:${INFINITY_PORT:-7997}:7997"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks: [internal]

  # Ingestion API (the ONLY remote write entrypoint)
  # - validate/redact -> chunk -> embed -> upsert to Qdrant
  # - optional payload encryption envelope (see README)
  rag-ingest:
    build:
      context: ./rag-ingest
    container_name: rag-ingest
    restart: unless-stopped
    volumes:
      - rag_ingest_data:/data
      - ./gpu-tenant.yaml:/app/gpu-tenant.yaml:ro
    environment:
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET}
      - INGEST_REQUIRE_ENCRYPTION=${INGEST_REQUIRE_ENCRYPTION:-0}
      - INGEST_NONCE_DB=/data/nonces.db
      - INGEST_NONCE_STORE=${INGEST_NONCE_STORE:-sqlite}
      - INGEST_REDIS_URL=${INGEST_REDIS_URL:-}
      - INGEST_NONCE_KEY_PREFIX=${INGEST_NONCE_KEY_PREFIX:-ingest:nonce:}
      - INGEST_NONCE_ALLOW_SQLITE_FALLBACK=${INGEST_NONCE_ALLOW_SQLITE_FALLBACK:-0}
      - INGEST_MAX_SKEW_S=${INGEST_MAX_SKEW_S:-300}
      - QDRANT_URL=${QDRANT_URL:?set QDRANT_URL in .env (see .env.example)}
      - OLLAMA_URL=http://ollama:11434
      # Per-request keep_alive (#53); OLLAMA_KEEP_ALIVE stays the ollama daemon's default.
      - OLLAMA_REQUEST_KEEP_ALIVE=${OLLAMA_REQUEST_KEEP_ALIVE:-${OLLAMA_KEEP_ALIVE:-15m}}
      # argus-iris GPU leases around Ollama calls (#48): off unless ARGUS_GPU_COORDINATOR=broker.
      # A grant on ARGUS_GPU_HOME_NODE keeps OLLAMA_URL; one on another node (jarrah) uses
      # that node's Ollama. Pinned models (default: EMBED_MODEL) stay home.
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-none}
      - ARGUS_GPU_BROKER_URL=${ARGUS_GPU_BROKER_URL:-}
      - ARGUS_GPU_BROKER_TOKEN=${ARGUS_GPU_BROKER_TOKEN:-}
      - ARGUS_GPU_BROKER_FALLBACK=${ARGUS_GPU_BROKER_FALLBACK:-none}
      - ARGUS_GPU_TENANT=agent-composer
      - ARGUS_GPU_TENANT_MANIFEST=/app/gpu-tenant.yaml
      - ARGUS_GPU_HOME_NODE=${ARGUS_GPU_HOME_NODE:-dragon}
      - ARGUS_GPU_LEASE_TIMEOUT_S=${RAG_INGEST_GPU_LEASE_TIMEOUT_S:-300}
      - OLLAMA_LEASE_PINNED_MODELS=${OLLAMA_LEASE_PINNED_MODELS:-}
      - OLLAMA_LEASE_VRAM_MB=${OLLAMA_LEASE_VRAM_MB:-}
      - OLLAMA_LEASE_MODEL_MB=${OLLAMA_LEASE_MODEL_MB:-}
      - OLLAMA_NODE_URLS=${OLLAMA_NODE_URLS:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-audit_docs}
      # Extra text collections a signed request may target with `collection` (comma list; e.g. audit_docs)
      - INGEST_ALLOWED_COLLECTIONS=${INGEST_ALLOWED_COLLECTIONS:-}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      # One setting for both services: rag-ingest prefixes chunks, rag-chat prefixes queries (#32).
      - EMBED_TASK_PREFIXES=${EMBED_TASK_PREFIXES:-none}
      - EMBEDDER_STRICT=${EMBEDDER_STRICT:-0}
      - INGEST_CHUNK_SIZE=${INGEST_CHUNK_SIZE:-1000}
      - INGEST_CHUNK_OVERLAP=${INGEST_CHUNK_OVERLAP:-120}
      - INGEST_UPSERT_BATCH_SIZE=${INGEST_UPSERT_BATCH_SIZE:-64}
      - OOM_WAIT_MAX_SECONDS=${OOM_WAIT_MAX_SECONDS:-180}
      - OOM_WAIT_INTERVAL_SECONDS=${OOM_WAIT_INTERVAL_SECONDS:-5}
      - INGEST_WORKER_CONCURRENCY=${INGEST_WORKER_CONCURRENCY:-1}
      - APP_RELOAD=${APP_RELOAD:-1}
      # Code-audit retrieval (additive; defaults preserve legacy text-only behavior)
      - RETRIEVAL_PROFILE=${RETRIEVAL_PROFILE:-text}
      - EMBED_BACKEND_URL=${EMBED_BACKEND_URL:-http://infinity:7997}
      - EMBED_MODEL_CODE=${EMBED_MODEL_CODE:-nomic-ai/CodeRankEmbed}
      - HYBRID_SPARSE=${HYBRID_SPARSE:-0}
      - QDRANT_COLLECTION_CODE=${QDRANT_COLLECTION_CODE:-code_audit}
    command: /app/init.sh
    # LAN-exposed: the remote signed-write ingestion entrypoint.
    ports:
      - "${RAG_INGEST_BIND_IP:-${BIND_ADDR:-127.0.0.1}}:${RAG_INGEST_PORT:-9050}:9050"
    depends_on: [ollama]
    healthcheck:
      # python:3.12-slim has neither wget nor curl; use stdlib probe.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9050/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Chat API (expose this, not Ollama)
  rag-chat:
    build:
      context: ./rag-chat
    container_name: rag-chat
    restart: unless-stopped
    volumes:
      - rag_chat_data:/data
      - rag_chat_media:/data/media
      - ./gpu-tenant.yaml:/app/gpu-tenant.yaml:ro
    environment:
      # Forwarded to the GPU sidecars' /admin/* by /api/runtime/residents (argus-iris).
      - ARGUS_ADMIN_TOKEN=${ARGUS_ADMIN_TOKEN:-}
      - OLLAMA_URL=http://ollama:11434
      # Per-request keep_alive (#53); OLLAMA_KEEP_ALIVE stays the ollama daemon's default.
      - OLLAMA_REQUEST_KEEP_ALIVE=${OLLAMA_REQUEST_KEEP_ALIVE:-${OLLAMA_KEEP_ALIVE:-15m}}
      # argus-iris GPU leases around Ollama calls (#48): off unless ARGUS_GPU_COORDINATOR=broker.
      # A grant on ARGUS_GPU_HOME_NODE keeps OLLAMA_URL; one on another node (jarrah) uses
      # that node's Ollama. Pinned models (default: EMBED_MODEL) stay home.
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-none}
      - ARGUS_GPU_BROKER_URL=${ARGUS_GPU_BROKER_URL:-}
      - ARGUS_GPU_BROKER_TOKEN=${ARGUS_GPU_BROKER_TOKEN:-}
      - ARGUS_GPU_BROKER_FALLBACK=${ARGUS_GPU_BROKER_FALLBACK:-none}
      - ARGUS_GPU_TENANT=agent-composer
      - ARGUS_GPU_TENANT_MANIFEST=/app/gpu-tenant.yaml
      - ARGUS_GPU_HOME_NODE=${ARGUS_GPU_HOME_NODE:-dragon}
      - ARGUS_GPU_LEASE_TIMEOUT_S=${RAG_CHAT_GPU_LEASE_TIMEOUT_S:-60}
      - OLLAMA_LEASE_PINNED_MODELS=${OLLAMA_LEASE_PINNED_MODELS:-}
      - OLLAMA_LEASE_VRAM_MB=${OLLAMA_LEASE_VRAM_MB:-}
      - OLLAMA_LEASE_MODEL_MB=${OLLAMA_LEASE_MODEL_MB:-}
      - OLLAMA_NODE_URLS=${OLLAMA_NODE_URLS:-}
      - MODERNBERT_URL=${MODERNBERT_URL:-http://modernbert:7998}
      - INFINITY_URL=${INFINITY_URL:-http://infinity:7997}
      # Repair related-code search: same code collection and embedder as rag-ingest's code path (#35).
      - QDRANT_COLLECTION_CODE=${QDRANT_COLLECTION_CODE:-code_audit}
      - EMBED_MODEL_CODE=${EMBED_MODEL_CODE:-nomic-ai/CodeRankEmbed}
      - CHAT_MODEL=${CHAT_MODEL:-llama3.2:3b}
      # /api/guard/check proxies to argus-retina's SingGuard server (empty: the route answers 503).
      - GUARD_URL=${GUARD_URL:-}
      - GUARD_TIMEOUT=${GUARD_TIMEOUT:-120}
      - GUARD_THINKING=${GUARD_THINKING:-fast-slow}
      - CHAT_SYSTEM_PROMPT=${CHAT_SYSTEM_PROMPT:-You are a helpful assistant.}
      - QDRANT_URL=${QDRANT_URL:?set QDRANT_URL in .env (see .env.example)}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-audit_docs}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      # One setting for both services: rag-ingest prefixes chunks, rag-chat prefixes queries (#32).
      - EMBED_TASK_PREFIXES=${EMBED_TASK_PREFIXES:-none}
      - EMBEDDER_STRICT=${EMBEDDER_STRICT:-0}
      - RAG_ENABLED=${RAG_ENABLED:-1}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_MAX_CONTEXT_CHARS=${RAG_MAX_CONTEXT_CHARS:-4000}
      # Remote PostgreSQL on the stateful node — full DSN supplied via .env.
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env (see .env.example)}
      - CHAT_HISTORY_MAX_MSGS=${CHAT_HISTORY_MAX_MSGS:-100}
      - DEV_AUTH_BYPASS=${DEV_AUTH_BYPASS:-0}
      - DEV_DEFAULT_USER=${DEV_DEFAULT_USER:-dev@example.com}
      - DEV_AUTH_USERS=${DEV_AUTH_USERS:-}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - MEDIA_DIR=/data/media
      - MEDIA_BACKEND=${MEDIA_BACKEND:-local}
      - MEDIA_S3_ENDPOINT_URL=${MEDIA_S3_ENDPOINT_URL:-}
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:-}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION:-us-east-1}
      - MEDIA_S3_ACCESS_KEY_ID=${MEDIA_S3_ACCESS_KEY_ID:-}
      - MEDIA_S3_SECRET_ACCESS_KEY=${MEDIA_S3_SECRET_ACCESS_KEY:-}
      - MEDIA_S3_USE_SSL=${MEDIA_S3_USE_SSL:-0}
      - MEDIA_S3_PREFIX=${MEDIA_S3_PREFIX:-rag-chat-media}
      - PROVIDER_ENCRYPTION_KEY=${PROVIDER_ENCRYPTION_KEY:-}
      - ALLOW_PLAINTEXT_PROVIDER_KEYS=${ALLOW_PLAINTEXT_PROVIDER_KEYS:-}
      - COMFYUI_URL=${COMFYUI_URL:-http://comfyui:8188}
      - OOM_WAIT_MAX_SECONDS=${OOM_WAIT_MAX_SECONDS:-180}
      - OOM_WAIT_INTERVAL_SECONDS=${OOM_WAIT_INTERVAL_SECONDS:-5}
      - INFERENCE_WORKER_CONCURRENCY=${INFERENCE_WORKER_CONCURRENCY:-1}
      - APP_RELOAD=${APP_RELOAD:-1}
      # ai-code-auditor audit API — used by the repair router for diff generation,
      # validate_patch, and git ops.  Routed via host.docker.internal because
      # audit-api lives in a separate Docker network (ai-code-auditor_default).
      - AUDIT_API_URL=${AUDIT_API_URL:-http://host.docker.internal:8765}
      - ECOSYSTEM_CONFIG_PATH=${ECOSYSTEM_CONFIG_PATH:-/home/smk/ai-code-auditor/config/ecosystem.yaml}
      # Base URL for pack_id-driven repairs (GET /audit/packs/{id}); empty falls back to AUDIT_API_URL.
      - AI_AUDIT_PUBLIC_BASE_URL=${AI_AUDIT_PUBLIC_BASE_URL:-}
      # Extra audit API origins a repair request may name (host or host:port, comma-separated; * = any).
      - AUDIT_API_ALLOWED_HOSTS=${AUDIT_API_ALLOWED_HOSTS:-}
      - AI_AUDIT_API_TOKEN=${AI_AUDIT_API_TOKEN:-}
      # Voice services. STT is Whisper; TTS is a registry of selectable engines.
      # Voice engines are argus-echo's, run by echo's own compose (on dragon,
      # ~/argus-echo, published on ECHO_BIND), not by this stack (#81). rag-chat
      # only proxies to them: set these to echo's engines, e.g.
      # http://<AGENT_HOST>:8144 (whisper) and :8141 (xtts). Empty disables that
      # engine. TTS_DEFAULT_ENGINE picks the default; TTS_URL names an optional
      # custom engine ("tts").
      - WHISPER_URL=${WHISPER_URL:-}
      - XTTS_TTS_URL=${XTTS_TTS_URL:-}
      - MISO_TTS_URL=${MISO_TTS_URL:-}
      - TTS_DEFAULT_ENGINE=${TTS_DEFAULT_ENGINE:-xtts}
      # Engine used (for default-path requests only) when the default engine is
      # unreachable. Empty auto-selects xtts when the default is something else.
      - TTS_FALLBACK_ENGINE=${TTS_FALLBACK_ENGINE:-}
      - TTS_URL=${TTS_URL:-}
      # argus-iris leases for XTTS synth (#79, with ARGUS_GPU_COORDINATOR=broker): a grant
      # on another node calls XTTS_NODE_URLS[node] (node=url,...), else iris's base_url.
      # Refused on the last engine: run on the local XTTS CPU (1) or answer 503 (0).
      - XTTS_NODE_URLS=${XTTS_NODE_URLS:-}
      - XTTS_LEASE_CPU_FALLBACK=${XTTS_LEASE_CPU_FALLBACK:-1}
      - XTTS_LEASE_VRAM_MB=${XTTS_LEASE_VRAM_MB:-2000}
      - XTTS_LEASE_MODEL_MB=${XTTS_LEASE_MODEL_MB:-1800}
      # Extra GPU sidecars for the argus-iris gateway (/api/runtime/residents), as
      # name=url pairs, never TTS engines. Empty (the default) adds none.
      - RUNTIME_EXTRA_RESIDENTS=${RUNTIME_EXTRA_RESIDENTS:-}
      - VOICE_TIMEOUT=${VOICE_TIMEOUT:-180}
      # Shared "voice" MinIO bucket — lets the proxy re-host rendered audio from
      # remote engines (e.g. Miso on another subnet) so browsers always fetch it
      # from the LAN-reachable S3_PUBLIC_URL. Same creds the xtts sidecar uses.
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL in .env (see .env.example)}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-voice}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:?set S3_PUBLIC_URL in .env (see .env.example)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: /app/init.sh
    # LAN-exposed: chat UI + API (browser-facing).
    ports:
      - "${RAG_CHAT_BIND_IP:-${BIND_ADDR:-127.0.0.1}}:${RAG_CHAT_PORT:-9150}:9150"
    depends_on:
      ollama:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9150/health', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks: [internal]

  # ModernBERT classifier sidecar — lazy-loads on first request, auto-evicts after idle.
  # States: unloaded → cpu → gpu. /health always 200; check model_state field.
  # Override memory policy: MODERNBERT_KEEP_ALIVE_GPU / KEEP_ALIVE_CPU (-1=forever, 0=immediate, N=seconds)
  modernbert:
    build:
      context: ./modernbert
    container_name: modernbert
    restart: unless-stopped
    gpus: all
    environment:
      # argus-iris resident contract: Bearer token for /admin/* (open when empty).
      - ARGUS_ADMIN_TOKEN=${ARGUS_ADMIN_TOKEN:-}
      - MODERNBERT_MODEL=${MODERNBERT_MODEL:-answerdotai/ModernBERT-base}
      - MODERNBERT_TASK=${MODERNBERT_TASK:-zero_shot}
      - MODERNBERT_DEVICE=${MODERNBERT_DEVICE:-auto}
      - MODERNBERT_LABELS=${MODERNBERT_LABELS:-}
      - MODERNBERT_LABELS_FILE=${MODERNBERT_LABELS_FILE:-/data/labels.json}
      - MODERNBERT_TOP_K=${MODERNBERT_TOP_K:-10}
      - MODERNBERT_THRESHOLD=${MODERNBERT_THRESHOLD:-0.05}
      - MODERNBERT_MAX_LENGTH=${MODERNBERT_MAX_LENGTH:-512}
      - MODERNBERT_POOL=${MODERNBERT_POOL:-mean}
      - MODERNBERT_PRELOAD=${MODERNBERT_PRELOAD:-0}
      - MODERNBERT_KEEP_ALIVE_GPU=${MODERNBERT_KEEP_ALIVE_GPU:-300}
      - MODERNBERT_KEEP_ALIVE_CPU=${MODERNBERT_KEEP_ALIVE_CPU:-0}
      - HF_HOME=/data/hf
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - modernbert_data:/data
    # Loopback only: real access is via rag-chat's /api/pipeline/* proxy
    # (http://modernbert:7998 on the internal net). Host port is for debugging.
    ports:
      - "127.0.0.1:${MODERNBERT_PORT:-7998}:7998"
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://127.0.0.1:7998/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [internal]

  # Cloudflare Tunnel (publish ONLY rag-ingest + rag-chat hostnames in Cloudflare UI)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles: [cloud]
    depends_on: [rag-ingest, rag-chat]
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks: [internal]

networks:
  internal:
    name: rag-internal
    driver: bridge

volumes:
  ollama:
  rag_ingest_data:
  rag_chat_data:
  rag_chat_media:
  infinity_hf_cache:
  modernbert_data:
