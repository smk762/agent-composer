# argus-iris GPU tenant manifest for agent-composer (#45). Validated by argus-cortex's
# TenantManifest (argus_cortex.gpu_wire, schema gpu-tenant-schema.json); unknown fields
# are refused. CI checks it validates (the gpu-tenant job), and
# rag-chat/tests/test_gpu_tenant.py checks it matches rag-chat's resident gateway.
# See argus-iris DESIGN.md, "Tenant manifests".
#
# kinds: with ARGUS_GPU_COORDINATOR=broker, rag-chat and rag-ingest take an
# ollama:<model> lease around each Ollama call (app/gpu_lease.py, #48) and register this
# manifest on their first lease. Each kind's target names its default model; a lease
# names the model actually called. A request's X-Argus-Priority header overrides the
# priority. residents: the models agent-composer keeps loaded, which iris reads and evicts.
#
# The sidecars listen on loopback, so iris reaches every argus-http resident through
# rag-chat's gateway, <rag-chat>/api/runtime/residents/<name>. The gateway needs a
# rag-chat API key as Bearer even for reads (RAG_CHAT_API_KEY on the broker; issue one
# with `docker exec rag-chat python -m app.issue_api_key --user argus-iris`; iris's
# config sends it with token_env: RAG_CHAT_API_KEY). rag-chat adds ARGUS_ADMIN_TOKEN
# itself when it calls a sidecar's /admin/*, so these residents have admin_auth false:
# true would make iris send the admin token as the Bearer, which rag-chat refuses as an
# unknown API key. Tokens live in each host's .env, never here.
#
# VRAM figures are MiB and are left out where nobody has measured them; iris's
# observe-only rollout learns them. A kind's vram_mb is the whole footprint and model_mb
# the weights part (Ollama /api/ps size_vram), which iris doesn't ask for again while the
# model is loaded; vram_mb - model_mb is the working set (KV cache, activations). They
# match app/gpu_lease.py's VRAM_MB/MODEL_MB, which every lease sends (#50), and
# rag-chat/tests/test_gpu_tenant.py checks that they agree. Miso is not listed: it runs on morpheus and is a
# voluptas resident (voluptas/gpu-tenant.yaml).
tenant_version: "1.0"
tenant: agent-composer
description: RAG chat and ingest, SingGuard content checks, and the voice stack (STT, TTS, classifier, code embedder).
repo: smk762/agent-composer
node: dragon
kinds:
  # rag-chat /chat (stream and not), qwen3:8b (CHAT_MODEL) on dragon.
  - kind: chat
    description: A chat completion someone is waiting on.
    target: "ollama:qwen3:8b"
    vram_mb: 6000                 # 5.2 GB weights plus KV cache
    model_mb: 5300                 # loaded size_vram (jarrah, 2026-11-16)
    priority: interactive
  # rag-chat /api/guard/check: one lease covers both passes of a cascade. SingGuard is
  # only on dragon.
  - kind: guard
    description: A SingGuard content check (cull scans, darkroom pre-flights, the guard tester).
    target: "ollama:hf.co/inclusionAI/SingGuard-4b-GGUF:Q4_K_M"
    vram_mb: 6000
    model_mb: 3900                 # loaded size_vram 3934 MiB (dragon, 2026-11-16)
    priority: interactive
    constraints: {node: dragon}
  # rag-chat's RAG query embedding. Pinned to dragon: queries must use the embedder that
  # wrote the collection.
  - kind: embed-query
    description: Embedding a chat or /search query.
    target: "ollama:nomic-embed-text"
    vram_mb: 600
    model_mb: 320                 # loaded size_vram (dragon, 2026-11-16)
    priority: interactive
    constraints: {node: dragon}
  # rag-ingest's text path: one lease per document's chunks.
  - kind: embed-ingest
    description: Embedding a document's chunks for the text collection.
    target: "ollama:nomic-embed-text"
    vram_mb: 600
    model_mb: 320
    priority: batch
    constraints: {node: dragon}
  # rag-chat /api/pipeline/{overlay,brain,prose}.
  - kind: pipeline
    description: Character pipeline stages (voice directive, plan, streamed prose).
    target: "ollama:qwen3:8b"
    vram_mb: 6000
    model_mb: 5300
    priority: interactive
  # rag-chat /api/repair/run: fixer, critic and adversary calls.
  - kind: repair
    description: One model call in the multi-model repair loop.
    target: "ollama:qwen3:8b"
    vram_mb: 6000
    model_mb: 5300
    priority: batch
residents:
  # Ollama on dragon. iris's ollama adapter uses /api/ps and keep_alive on :11434 directly
  # (rag-chat does not proxy it). Set OLLAMA_REQUEST_KEEP_ALIVE=server once iris owns
  # Ollama residency, or every rag-chat/rag-ingest call resets the keep-alive iris sets.
  - name: singguard
    adapter: ollama
    target: "ollama:hf.co/inclusionAI/SingGuard-4b-GGUF:Q4_K_M"   # GUARD_MODEL
    container: ollama
    base_url: http://dragon:11434
    vram_mb: 3940                 # 3934 MiB loaded at the default context (2026-11-16)
    pinned: true                  # content checks for cull scans and darkroom pre-flights

  # The text embedder for ingest and chat queries (EMBED_MODEL).
  - name: nomic-embed-text
    adapter: ollama
    target: "ollama:nomic-embed-text"
    container: ollama
    base_url: http://dragon:11434

  # ModernBERT classifier: unloaded -> cpu -> gpu, so evict parks it on CPU.
  - name: modernbert
    adapter: argus-http
    container: modernbert
    base_url: http://dragon:9150/api/runtime/residents/modernbert
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: false             # rag-chat adds ARGUS_ADMIN_TOKEN

  # faster-whisper STT. No CPU stage (its /admin/evict is the same as unload), so no
  # evict_path. Answers 409 busy while a transcription is running.
  - name: whisper
    adapter: argus-http
    container: whisper
    base_url: http://dragon:9150/api/runtime/residents/whisper
    health_path: /health
    unload_path: /admin/unload
    warm_path: /admin/wake
    admin_auth: false             # rag-chat adds ARGUS_ADMIN_TOKEN

  # XTTS-v2, the default TTS engine. Answers 409 busy while synthesising.
  - name: xtts
    adapter: argus-http
    container: xtts
    base_url: http://dragon:9150/api/runtime/residents/xtts
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    vram_mb: 2000                 # about 2 GB loaded
    admin_auth: false             # rag-chat adds ARGUS_ADMIN_TOKEN

  # Qwen3-TTS. argus-mask calls it directly on :8031; it isn't one of rag-chat's TTS
  # engines, so the gateway serves it through RUNTIME_EXTRA_RESIDENTS (compose default
  # tts=http://tts:8031).
  - name: tts
    adapter: argus-http
    container: tts
    base_url: http://dragon:9150/api/runtime/residents/tts
    health_path: /health
    unload_path: /admin/unload
    evict_path: /admin/evict
    warm_path: /admin/wake
    admin_auth: false             # rag-chat adds ARGUS_ADMIN_TOKEN

  # Infinity (CodeRankEmbed) behind its idle manager (INFINITY_IDLE_TIMEOUT stays on).
  # Evict is the same as unload, so no evict_path. Answers 409 busy with requests in flight.
  - name: infinity
    adapter: argus-http
    container: infinity
    base_url: http://dragon:9150/api/runtime/residents/infinity
    health_path: /health
    unload_path: /admin/unload
    warm_path: /admin/wake
    vram_mb: 1300                 # 0.8 GiB loaded, 1.3 GiB peak at batch 8
    admin_auth: false             # rag-chat adds ARGUS_ADMIN_TOKEN
